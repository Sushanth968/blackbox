version: 2
updates:
  # Backend Python dependencies — all grouped into one daily PR
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: daily
    groups:
      backend-python:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # Frontend npm dependencies — all grouped into one daily PR
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    groups:
      frontend-npm:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # GitHub Actions — all grouped into one daily PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
