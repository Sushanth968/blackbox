workspace:
  name: "Developer Incident Investigation"
  description: "Workspace for software incident reconstruction — git, CI/CD, app logs"

parsers:
  enabled:
    - json
    - jsonl
    - csv
    - log
    - git
    - cicd
    - syslog

temporal:
  out_of_order_threshold_seconds: 1
  clock_skew_threshold_seconds: 300
  duplicate_timestamp_min_count: 3
  gap_anomaly_multiplier: 10
  gap_anomaly_min_seconds: 3600
  dependency_rules:
    - name: deploy-after-build
      cause: {action: build}
      effect: {action: deploy}
      scope: [object]
    - name: logout-after-login
      cause: {action: login}
      effect: {action: logout}
      scope: [actor]

entities:
  extract: [user, ip, email, path, url, hash]
  ignore: []

correlation:
  enabled: true
  max_window_seconds: 3600
  shared_identifier_confidence: 0.75
  causal_rule_confidence: 0.85
  identifier_fields: [object, ip]
  rules:
    - name: build-caused-deploy
      cause: {action: build}
      effect: {action: deploy}
      scope: [object]
      max_lag_seconds: 1800
    - name: deploy-caused-error
      cause: {action: deploy}
      effect: {severity: error}
      scope: []
      max_lag_seconds: 600

export:
  include_raw: true
  report_raw_max_length: 200
  report_sections:
    - summary
    - evidence_files
    - temporal_conflicts
    - flagged_events
    - notes
    - entities
